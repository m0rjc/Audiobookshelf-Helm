apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-lb
  namespace: ingress
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.100.1
spec:
  type: LoadBalancer
  selector:
    name: nginx-ingress-microk8s
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
